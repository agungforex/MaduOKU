symbols:
  gold: "GC=F"      # Gold futures (yfinance ticker)
  bitcoin: "BTC-USD"

interval: "1h"        # 1m,5m,15m,1h,4h,1d (subject to yfinance limits per interval)
lookback_period: "60d" # how much history to fetch

indicators:
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  adx_period: 14
  adx_trend_threshold: 25   # ADX above this = trending regime

divergence:
  pivot_left: 3
  pivot_right: 3
  max_pivot_lookback: 5     # how many recent pivots to compare

scoring:
  min_score_to_alert: 2     # confluence points needed before alerting

telegram:
  enabled: false
  # set TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID as env vars instead of here
