data_source: "binance_futures"  # "yfinance" | "binance_futures"

symbols:
  gold:
    yfinance: "GC=F"           # Gold futures
    binance_futures: "PAXGUSDT" # PAX Gold perpetual — tracks spot gold price
  bitcoin:
    yfinance: "BTC-USD"
    binance_futures: "BTCUSDT"

interval: "1h"          # 1m,5m,15m,1h,4h,1d (valid for both yfinance and Binance klines)
lookback_period: "60d"  # used only when data_source is "yfinance"
binance_limit: 500      # number of candles to fetch when data_source is "binance_futures" (max 1500)

indicators:
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  adx_period: 14
  adx_trend_threshold: 25   # ADX above this = trending regime

divergence:
  pivot_left: 3
  pivot_right: 3
  max_pivot_lookback: 5     # how many recent pivots to compare

liquidity_sweep:
  enabled: true
  lookback: 20              # bars to look back for the prior high/low to sweep

# Macro instruments aren't on Binance Futures, so these are always fetched via
# yfinance regardless of data_source above. correlation: +1 = macro instrument
# moves with the symbol, -1 = moves opposite it.
macro_filters:
  enabled: true
  lookback: 5                # bars to measure the macro instrument's trend over
  filters:
    gold:
      - ticker: "DX-Y.NYB"    # US Dollar Index — typically inverse to gold
        correlation: -1
      - ticker: "^VIX"        # risk-off flows tend to support gold
        correlation: 1
    bitcoin:
      - ticker: "^VIX"        # risk-off tends to hurt risk assets like bitcoin
        correlation: -1

scoring:
  min_score_to_alert: 2     # confluence points needed before alerting

telegram:
  enabled: false
  # set TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID as env vars instead of here
